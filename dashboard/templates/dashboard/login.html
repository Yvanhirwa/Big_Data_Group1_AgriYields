{% extends "dashboard/base.html" %}
{% load static %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="bg-white p-6 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">Sign in</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Username</label>
          {{ form.username }}
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          {{ form.password }}
        </div>
      </div>
      <button type="submit" class="mt-6 w-full bg-green-600 text-white py-2 rounded">Sign in</button>
    </form>
    <div class="mt-4 flex justify-between text-sm">
      <a href="{% url 'password_reset' %}" class="text-indigo-600">Forgot password?</a>
      <a href="{% url 'signup' %}" class="text-green-600">Create account</a>
    </div>
  </div>
</div>
{% endblock %}

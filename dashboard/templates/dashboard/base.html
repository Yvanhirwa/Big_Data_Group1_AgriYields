<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriYield Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-green-700 text-white min-h-screen p-6">
            <h1 class="text-2xl font-bold mb-10">AgriYield</h1>

            <nav class="space-y-4">
                <a href="/dashboard/" class="block hover:bg-green-600 p-2 rounded">Dashboard</a>
                <a href="/dashboard/upload/" class="block hover:bg-green-600 p-2 rounded">Upload Data</a>
                <a href="/dashboard/results/" class="block hover:bg-green-600 p-2 rounded">Model Results</a>
                <a href="/dashboard/predict/" class="block hover:bg-green-600 p-2 rounded">AI Prediction</a>
                <a href="/dashboard/export-pdf/" class="block hover:bg-green-600 p-2 rounded">Export PDF</a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="flex-1 p-10">
            {% block content %}
            {% endblock %}
        </main>
    </div>

</body>
</html>

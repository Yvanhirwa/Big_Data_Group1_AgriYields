{% extends "dashboard/base.html" %}
{% block content %}
<h2 class="text-2xl mb-4">Upload CSVs & Run Analysis</h2>
<form method="post" enctype="multipart/form-data" class="space-y-4">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded">Run Analysis</button>
</form>
{% endblock %}

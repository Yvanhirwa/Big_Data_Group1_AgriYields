{% extends "dashboard/base.html" %}

{% block content %}
<h2 class="text-3xl font-semibold mb-6">Dashboard Overview</h2>

<div class="grid grid-cols-3 gap-6">

    <div class="bg-white p-6 rounded shadow">
        <h3 class="text-gray-600">Avg Temperature</h3>
        <p class="text-2xl font-bold">{{ avg_temperature }}°C</p>
    </div>

    <div class="bg-white p-6 rounded shadow">
        <h3 class="text-gray-600">Avg Rainfall</h3>
        <p class="text-2xl font-bold">{{ avg_rainfall }} mm/day</p>
    </div>

    <div class="bg-white p-6 rounded shadow">
        <h3 class="text-gray-600">Avg Soil Moisture</h3>
        <p class="text-2xl font-bold">{{ avg_soil }}%</p>
    </div>

</div>

<div class="mt-10 bg-white p-6 rounded shadow">
    <h3 class="text-xl mb-4">Yield Index Bar Chart</h3>
    <img src="{{ yield_chart_url }}" class="w-full"/>
</div>

{% endblock %}

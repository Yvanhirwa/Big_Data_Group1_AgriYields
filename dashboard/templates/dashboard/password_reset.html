{% extends "dashboard/base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="bg-white p-6 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">Reset password</h2>
    <p class="text-sm text-gray-600 mb-4">Enter the email for your account and we'll send instructions.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.email.label_tag }} {{ form.email }}
      <button type="submit" class="mt-4 w-full bg-indigo-600 text-white py-2 rounded">Send reset email</button>
    </form>
  </div>
</div>
{% endblock %}
